<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist – GigsFill</title>
<meta name="robots" content="noindex">
<!--
  PROTOTYPE — artist profile redesign, 2026-10-01.
  Lives alongside the current artist-profile.html rather than replacing it,
  so the two can be compared on the same data. Same endpoints, no backend
  changes.

  What this changes and why:
   • The current page hides six of seven sections behind tabs and opens on a
     month calendar grid. For Fridays Past that means ~65% of the page is
     empty cells and none of their 11 media items are visible without a
     click. A venue evaluating an artist wants to see and hear them first.
     So: one scroll, media near the top, nav anchors instead of tab panels.
   • The artist's own artwork becomes the page identity rather than a
     bordered thumbnail sitting on our background.
   • Upcoming dates render as a compact list. A month grid with one booking
     advertises an empty diary; a list answers "are they free on the 17th"
     in a tenth of the space.
   • One primary action. "Booking: name - email - phone" was a line of text.
-->
<link href="/app/static/css/gigsfill.css?v=16" rel="stylesheet"/>
<link href="/app/static/css/mobile.css?v=6" rel="stylesheet"/>
<style>
  /* ── tokens ─────────────────────────────────────────────────────────
     Built on the site palette (--bg/--card/--cyan/--purple). The additions
     are a deeper ground than --bg so the hero can sit above it, and two
     neutrals biased slightly toward the cyan accent so greys read as
     chosen rather than defaulted. */
  :root {
    --v2-ground: #070a11;
    --v2-raise: #121826;
    --v2-raise-2: #182031;
    --v2-line: rgba(148, 163, 184, 0.14);
    --v2-line-soft: rgba(148, 163, 184, 0.08);
    --v2-dim: #8a98ad;
    --v2-dimmer: #64748b;
    --v2-max: min(1180px, calc(100vw - 32px));
  }

  body.v2 {
    background: var(--v2-ground);
    color: var(--text);
    margin: 0;
  }

  .v2-wrap { max-width: var(--v2-max); margin: 0 auto; }

  /* ── hero ───────────────────────────────────────────────────────────
     The artist's photo fills the band; their logo sits on top of it. A
     two-stop scrim keeps the name legible over whatever they uploaded —
     we can't predict brightness, so the gradient does the work rather
     than hoping the image cooperates. */
  .v2-hero {
    position: relative;
    min-height: 420px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
    border-bottom: 1px solid var(--v2-line);
  }
  .v2-hero-bg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    transform: scale(1.06);
    filter: saturate(0.9);
  }
  .v2-hero-scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(7,10,17,0.30) 0%, rgba(7,10,17,0.70) 48%, rgba(7,10,17,0.97) 100%),
      linear-gradient(90deg, rgba(7,10,17,0.80) 0%, rgba(7,10,17,0.30) 55%, transparent 100%),
      radial-gradient(1200px 400px at 20% 100%, rgba(139,92,246,0.20), transparent 70%);
  }
  /* No photo yet — don't fall back to a flat block; a quiet gradient still
     reads as designed. */
  .v2-hero.no-photo .v2-hero-bg {
    background: radial-gradient(900px 400px at 25% 0%, rgba(139,92,246,0.22), transparent 65%),
                radial-gradient(900px 400px at 85% 100%, rgba(6,182,212,0.16), transparent 65%),
                var(--v2-raise);
    transform: none;
  }
  .v2-hero-inner {
    position: relative;
    width: 100%;
    padding: 92px 0 40px;
  }
  .v2-hero-grid {
    display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap;
  }
  .v2-logo {
    width: 150px; height: 112px; flex: 0 0 auto;
    border-radius: 12px;
    /* `contain`, not `cover`: a band logo is usually a wide wordmark and
       cover crops the name clean off. Padding + a dark plate means a
       transparent PNG still reads against the hero photo. */
    object-fit: contain;
    padding: 10px;
    background: rgba(8, 11, 18, 0.72);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 18px 40px rgba(0,0,0,0.55);
  }
  .v2-head { flex: 1 1 320px; min-width: 0; }
  .v2-name {
    margin: 0 0 6px;
    font-size: clamp(2rem, 4.6vw, 3.1rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.02;
    text-wrap: balance;
  }
  .v2-sub { color: #c7d2e1; font-size: 0.98rem; margin-bottom: 14px; }
  .v2-sub .dot { color: var(--v2-dimmer); margin: 0 7px; }

  .v2-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 16px; }
  .v2-chip {
    font-size: 0.74rem; font-weight: 600; letter-spacing: 0.02em;
    padding: 5px 11px; border-radius: 999px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    color: #dbe4f0;
  }
  .v2-chip.accent {
    background: rgba(139,92,246,0.18);
    border-color: rgba(139,92,246,0.45);
    color: #cbb8ff;
  }

  .v2-cta-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .v2-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 22px; border-radius: 8px;
    font-size: 0.9rem; font-weight: 700; cursor: pointer;
    border: 1px solid transparent; text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .v2-btn:active { transform: translateY(1px); }
  .v2-btn.primary {
    background: linear-gradient(135deg, var(--purple), var(--cyan));
    color: #06121a;
  }
  .v2-btn.primary:hover { box-shadow: 0 8px 26px rgba(6,182,212,0.32); }
  .v2-btn.ghost {
    background: rgba(255,255,255,0.05);
    border-color: rgba(255,255,255,0.18);
    color: var(--text);
  }
  .v2-btn.ghost:hover { background: rgba(255,255,255,0.1); border-color: var(--cyan); color: var(--cyan); }

  .v2-rating { display: inline-flex; align-items: center; gap: 7px; font-size: 0.9rem; }
  .v2-stars { color: #fbbf24; letter-spacing: 1px; }

  /* ── section nav ────────────────────────────────────────────────────
     Replaces the tab bar. Anchors scroll rather than hide, so nothing is
     discoverable only by clicking. */
  .v2-nav {
    position: sticky; top: 0; z-index: 40;
    background: rgba(7,10,17,0.86);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--v2-line);
  }
  .v2-nav-inner { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .v2-nav-inner::-webkit-scrollbar { display: none; }
  .v2-nav a {
    padding: 13px 14px; font-size: 0.82rem; font-weight: 600;
    color: var(--v2-dim); text-decoration: none; white-space: nowrap;
    border-bottom: 2px solid transparent;
  }
  .v2-nav a:hover { color: var(--text); }
  .v2-nav a.on { color: var(--cyan); border-bottom-color: var(--cyan); }

  /* ── sections ───────────────────────────────────────────────────────
     Alternating grounds give the long scroll rhythm, so it reads as
     distinct chapters rather than one undifferentiated column. */
  .v2-sec { padding: 46px 0; scroll-margin-top: 58px; }
  .v2-sec.alt { background: var(--v2-raise); border-block: 1px solid var(--v2-line-soft); }
  .v2-sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .v2-sec-head h2 {
    margin: 0; font-size: 0.78rem; font-weight: 800;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan);
  }
  .v2-sec-head .count { font-size: 0.78rem; color: var(--v2-dimmer); }

  /* ── media ──────────────────────────────────────────────────────────
     Videos carry their own thumbnails via video-thumbnail.js (YouTube
     maxres, branded fallback for Instagram/TikTok which expose none). */
  .v2-media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .v2-card {
    background: var(--v2-raise-2);
    border: 1px solid var(--v2-line);
    border-radius: 12px; overflow: hidden;
    transition: transform .14s ease, border-color .14s ease;
    text-decoration: none; color: inherit; display: block;
  }
  .v2-card:hover { transform: translateY(-3px); border-color: rgba(6,182,212,0.5); }
  .v2-thumb { position: relative; aspect-ratio: 16/9; background: #0d1220; overflow: hidden; }
  .v2-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .v2-play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  }
  .v2-play span {
    width: 48px; height: 48px; border-radius: 999px;
    background: rgba(0,0,0,0.55); border: 2px solid rgba(255,255,255,0.85);
    display: flex; align-items: center; justify-content: center;
  }
  .v2-play span::after {
    content: ""; width: 0; height: 0;
    border-left: 13px solid #fff; border-top: 8px solid transparent; border-bottom: 8px solid transparent;
    margin-left: 4px;
  }
  /* Quiet stand-in where a platform serves no public still. Deliberately
     low-contrast: four of these in a row should recede so the titles read,
     where four full-bleed brand gradients compete with each other. */
  .v2-thumb-blank {
    position: absolute; inset: 0;
    background:
      radial-gradient(420px 180px at 30% 15%, rgba(139,92,246,0.16), transparent 70%),
      linear-gradient(145deg, #141b2a 0%, #0e1420 100%);
    display: flex; align-items: flex-start; justify-content: flex-start;
    padding: 10px;
  }
  .v2-badge {
    font-size: 0.64rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--v2-dim);
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    padding: 3px 8px; border-radius: 5px;
  }
  .v2-card-body { padding: 12px 14px; }
  .v2-card-title { font-size: 0.88rem; font-weight: 650; margin-bottom: 3px; }
  .v2-card-sub { font-size: 0.76rem; color: var(--v2-dim); }

  .v2-photo-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
  }
  /* With only a couple of photos, auto-fill leaves small tiles stranded in a
     wide row. Give them room instead. */
  .v2-photo-grid.few { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .v2-photo {
    aspect-ratio: 4/3; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--v2-line); cursor: pointer; position: relative;
  }
  .v2-photo img { width: 100%; height: 100%; object-fit: cover; display: block;
                  transition: transform .25s ease; }
  .v2-photo:hover img { transform: scale(1.05); }
  .v2-photo figcaption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 18px 12px 9px; font-size: 0.76rem;
    background: linear-gradient(transparent, rgba(0,0,0,0.78));
  }

  /* ── about ──────────────────────────────────────────────────────── */
  .v2-about { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 40px; align-items: start; }
  .v2-bio { font-size: 1.02rem; line-height: 1.75; color: #d7dfea; max-width: 62ch; white-space: pre-line; }
  .v2-facts { display: grid; gap: 10px; }
  .v2-fact {
    display: flex; justify-content: space-between; gap: 14px;
    padding: 11px 14px; border-radius: 9px;
    background: var(--v2-raise-2); border: 1px solid var(--v2-line);
    font-size: 0.84rem;
  }
  .v2-fact dt { color: var(--v2-dim); margin: 0; }
  .v2-fact dd { margin: 0; font-weight: 650; text-align: right; }

  /* ── dates ──────────────────────────────────────────────────────────
     A list, not a month grid. One booking in a 35-cell grid reads as an
     empty diary; a list of real dates reads as a working band. */
  .v2-dates { display: grid; gap: 9px; }
  .v2-date {
    display: flex; align-items: center; gap: 16px;
    padding: 13px 16px; border-radius: 10px;
    background: var(--v2-raise-2); border: 1px solid var(--v2-line);
  }
  .v2-date-when {
    flex: 0 0 62px; text-align: center; line-height: 1.1;
  }
  .v2-date-mon { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--cyan); font-weight: 700; }
  .v2-date-day { font-size: 1.45rem; font-weight: 800; }
  .v2-date-main { flex: 1 1 auto; min-width: 0; }
  .v2-date-venue { font-weight: 650; font-size: 0.95rem; }
  .v2-date-meta { font-size: 0.79rem; color: var(--v2-dim); margin-top: 2px; }

  /* ── setlist ────────────────────────────────────────────────────────
     Distinctive to us — a covers band is largely judged on what they
     play, and no comparable site surfaces it. */
  .v2-songs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
  .v2-song {
    display: flex; align-items: baseline; gap: 10px;
    padding: 10px 14px; border-radius: 9px;
    background: var(--v2-raise-2); border: 1px solid var(--v2-line-soft);
  }
  .v2-song-n { font-size: 0.72rem; color: var(--v2-dimmer); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .v2-song-t { font-weight: 600; font-size: 0.89rem; }
  .v2-song-a { font-size: 0.78rem; color: var(--v2-dim); }

  /* ── social + contact ───────────────────────────────────────────── */
  .v2-social { display: flex; flex-wrap: wrap; gap: 9px; }
  .v2-social a {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 15px; border-radius: 999px;
    background: var(--v2-raise-2); border: 1px solid var(--v2-line);
    color: #dbe4f0; text-decoration: none; font-size: 0.83rem; font-weight: 600;
  }
  .v2-social a:hover { border-color: var(--cyan); color: var(--cyan); }

  .v2-contact {
    background: var(--v2-raise-2); border: 1px solid var(--v2-line);
    border-radius: 14px; padding: 26px; text-align: center;
  }
  .v2-contact h3 { margin: 0 0 8px; font-size: 1.2rem; }
  .v2-contact p { margin: 0 0 18px; color: var(--v2-dim); font-size: 0.9rem; }

  .v2-empty { color: var(--v2-dimmer); font-size: 0.87rem; padding: 14px 0; }

  /* ── lightbox ───────────────────────────────────────────────────── */
  .v2-lb {
    position: fixed; inset: 0; z-index: 120; display: none;
    background: rgba(3,5,10,0.94); align-items: center; justify-content: center; padding: 24px;
  }
  .v2-lb.open { display: flex; }
  .v2-lb img { max-width: 92vw; max-height: 88vh; border-radius: 10px; }
  .v2-lb-close {
    position: absolute; top: 18px; right: 22px; font-size: 1.8rem;
    color: #fff; background: none; border: none; cursor: pointer; line-height: 1;
  }

  @media (max-width: 760px) {
    .v2-about { grid-template-columns: 1fr; gap: 24px; }
    .v2-logo { width: 92px; height: 92px; }
    .v2-hero { min-height: 280px; }
    .v2-hero-inner { padding: 40px 0 22px; }
  }
</style>
</head>
<body class="dark-ui v2">

<header class="app-header">
  <div class="header-inner">
    <div class="logo"><img src="/app/static/img/gigsfill-logo.png" alt="GigsFill" style="height:44px;width:auto;flex-shrink:0;"></div>
    <div class="header-actions"><a class="btn ghost" href="/app/index.html">Home</a></div>
  </div>
</header>

<!-- HERO -->
<section class="v2-hero" id="v2Hero">
  <div class="v2-hero-bg" id="v2HeroBg"></div>
  <div class="v2-hero-scrim"></div>
  <div class="v2-hero-inner">
    <div class="v2-wrap">
      <div class="v2-hero-grid">
        <img id="v2Logo" class="v2-logo" src="/app/static/img/profile-placeholder.svg" alt="">
        <div class="v2-head">
          <h1 class="v2-name" id="v2Name">Artist</h1>
          <div class="v2-sub" id="v2Sub"></div>
          <div class="v2-chips" id="v2Chips"></div>
          <div class="v2-cta-row" id="v2Cta"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- SECTION NAV -->
<nav class="v2-nav" id="v2Nav">
  <div class="v2-wrap v2-nav-inner" id="v2NavInner"></div>
</nav>

<main>
  <section class="v2-sec" id="sec-watch">
    <div class="v2-wrap">
      <div class="v2-sec-head"><h2>Watch &amp; Listen</h2><span class="count" id="v2VideoCount"></span></div>
      <div class="v2-media-grid" id="v2Videos"></div>
      <div class="v2-empty" id="v2VideosEmpty" style="display:none;">No videos yet.</div>
    </div>
  </section>

  <section class="v2-sec alt" id="sec-photos">
    <div class="v2-wrap">
      <div class="v2-sec-head"><h2>Photos</h2><span class="count" id="v2PhotoCount"></span></div>
      <div class="v2-photo-grid" id="v2Photos"></div>
      <div class="v2-empty" id="v2PhotosEmpty" style="display:none;">No photos yet.</div>
    </div>
  </section>

  <section class="v2-sec" id="sec-about">
    <div class="v2-wrap">
      <div class="v2-sec-head"><h2>About</h2></div>
      <div class="v2-about">
        <div class="v2-bio" id="v2Bio"></div>
        <dl class="v2-facts" id="v2Facts"></dl>
      </div>
    </div>
  </section>

  <section class="v2-sec alt" id="sec-dates">
    <div class="v2-wrap">
      <div class="v2-sec-head"><h2>Upcoming Dates</h2><span class="count" id="v2DateCount"></span></div>
      <div class="v2-dates" id="v2Dates"></div>
      <div class="v2-empty" id="v2DatesEmpty" style="display:none;">No public dates on the calendar right now.</div>
    </div>
  </section>

  <section class="v2-sec" id="sec-setlist">
    <div class="v2-wrap">
      <div class="v2-sec-head"><h2>What They Play</h2><span class="count" id="v2SongCount"></span></div>
      <div class="v2-songs" id="v2Songs"></div>
      <div class="v2-empty" id="v2SongsEmpty" style="display:none;">No setlist posted yet.</div>
    </div>
  </section>

  <section class="v2-sec alt" id="sec-contact">
    <div class="v2-wrap">
      <div class="v2-sec-head"><h2>Find Them</h2></div>
      <div class="v2-social" id="v2Social" style="margin-bottom:26px;"></div>
      <div class="v2-contact" id="v2Contact"></div>
    </div>
  </section>
</main>

<div class="v2-lb" id="v2Lb">
  <button class="v2-lb-close" onclick="v2CloseLb()" aria-label="Close">&times;</button>
  <img id="v2LbImg" src="" alt="">
</div>

<footer style="text-align:center;padding:30px 20px;color:var(--v2-dimmer);font-size:0.8rem;border-top:1px solid var(--v2-line-soft);">
  © 2026 GigsFill · <a href="/app/legal.html" style="color:var(--v2-dimmer);">Terms &amp; Legal</a>
</footer>

<script src="/app/static/js/security.js?v=2"></script>
<script src="/app/static/js/time-format.js"></script>
<script src="/app/static/js/video-thumbnail.js?v=1"></script>
<script src="/app/static/js/artist-profile-v2.js?v=3"></script>
</body>
</html>

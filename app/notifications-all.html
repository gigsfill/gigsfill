<button class="btn ghost" onclick="window.history.back()">← Back</button>

<main class="container" style="max-width: 1400px; margin: 0 auto;">
<!-- Header & Filters Section -->
<section class="panel" style="margin-bottom: 20px;">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
<h2 style="margin: 0;">🔔 All Notifications</h2>
<div style="display: flex; gap: 12px;">
<select class="dark-dropdown" id="typeFilter">
<option value="all">All Types</option>
<option value="gig_cancelled">❌ Gig Cancelled</option>
<option value="preferred_approved">✅ Preferred Approved</option>
<option value="preferred_denied">❌ Preferred Denied</option>
<option value="preferred_request">📋 Preferred Request</option>
<option value="gig_booked">🎉 Gig Booked</option>
</select>
<select class="dark-dropdown" id="readFilter">
<option value="all">All</option>
<option value="unread">Unread Only</option>
<option value="read">Read Only</option>
</select>
<button class="btn primary" id="markAllRead">Mark All Read</button>
</div>
</div>
<!-- Stats Grid - Compact. auto-fit + minmax collapses cleanly: 4 columns
     on desktop, 2 on tablet, 1 on phone (the 4-column repeat was cramming
     stats into ~90px cells on a 375px iPhone). Added 2026-07-24. -->
<div id="summaryStats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px;">
<!-- Stats will be populated here -->
</div>
</section>
<!-- Notifications List Section - Full Width Below -->
<section class="panel">
<div id="notificationsList">
<p style="color: var(--text-muted); text-align: center;">Loading notifications...</p>
</div>
</section>
</main>
<style>
  /* Force proper layout - notifications below filters */
  main.container {
    display: block !important;
    max-width: 1400px !important;
    margin: 0 auto !important;
  }
  
  main.container > .panel {
    width: 100% !important;
    display: block !important;
  }
  
  /* Dark dropdown styling - COMPLETE */
  .dark-dropdown {
    padding: 8px 12px !important;
    background: rgba(255,255,255,0.05) !important;
    border: 1px solid rgba(255,255,255,0.2) !important;
    border-radius: 6px !important;
    color: white !important;
    font-family: inherit !important;
    cursor: pointer !important;
    transition: all 0.2s !important;
  }
  
  .dark-dropdown:hover {
    background: rgba(255,255,255,0.08) !important;
    border-color: rgba(255,255,255,0.3) !important;
  }
  
  .dark-dropdown:focus {
    outline: none !important;
    border-color: var(--accent-cyan) !important;
  }
  
  /* CRITICAL: Option background styling */
  .dark-dropdown option {
    background-color: #1a1f2e !important;
    color: white !important;
    padding: 8px !important;
  }
  
  /* Additional browser-specific option styling */
  select.dark-dropdown {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
    background-repeat: no-repeat;
    background-position: right 8px center;
    padding-right: 32px !important;
  }
  
  /* Ensure stats and list don't go side by side */
  #summaryStats {
    display: grid !important;
    /* auto-fit for responsive collapse — same logic as the inline
       style. Fixed 4-column blows up on iPhone. Fixed 2026-07-24. */
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)) !important;
    gap: 16px !important;
    margin-bottom: 0 !important;
  }
  
  #notificationsList {
    display: block !important;
    width: 100% !important;
  }

  /* Mobile font-size normalization for Activity Center notification
     rows (added 2026-07-25). The inline-styled rows in
     notifications-all.js use ~7 different font sizes (0.7rem, 0.75rem,
     0.8rem, 0.85rem, 1rem, 1.1rem, 1.5rem) which read as visually
     chaotic on a phone. Collapse to a single readable size except for
     the icon (which stays large as a visual anchor). Overrides are
     scoped to the notification container so they don't leak into the
     stats grid above. */
  @media (max-width: 640px) {
    #notificationsList > div > div * {
      font-size: 0.875rem !important;  /* 14px — matches title on mobile */
    }
    /* Keep the leading icon large as a visual anchor. */
    #notificationsList > div > div span[style*="1.5rem"] {
      font-size: 1.5rem !important;
    }
    /* Keep the NEW badge and Delete button visibly compact. */
    #notificationsList > div > div span[style*="border-radius: 12px"],
    #notificationsList > div > div button {
      font-size: 0.75rem !important;
    }
  }
</style>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venue Profile – GigsFill</title>
  <meta name="description" content="View this venue's profile, upcoming live music events, amenities, and booking details on GigsFill.">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/svg+xml" href="/app/static/img/GIGSFILL-LOGO-BRANDMARK-FULLCOLOR.svg">
  <link rel="icon" type="image/png" href="/app/static/img/GIGSFILL-LOGO-BRANDMARK-FULLCOLOR-SMALL.png">
  <link rel="manifest" href="/app/static/manifest.json">
  <link rel="apple-touch-icon" href="/app/static/img/gigsfill-logo_square.png">
  <meta name="theme-color" content="#0f1419">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Venue Profile – GigsFill">
  <meta property="og:description" content="View this venue's profile, upcoming live music events, and booking details on GigsFill.">
  <meta property="og:site_name" content="GigsFill">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Venue Profile – GigsFill">
  <meta name="twitter:description" content="View this venue's profile on GigsFill.">
  <link href="/app/static/css/gigsfill.css?v=10" rel="stylesheet">
  <link href="/app/static/css/gig-hover-card.css?v=10" rel="stylesheet">
  <link href="/app/static/css/mobile.css" rel="stylesheet">
  <link href="/app/static/css/modals.css?v=4" rel="stylesheet">
  <style>
    :root { --card-padding: 16px 20px; --card-gap: 10px; --section-title-size: 0.7rem; }
    .profile-container { max-width: var(--container-max); margin: 0 auto; padding: 0 20px 20px; }

    /* LOGO HERO — always visible.
       Logo slot: shows the uploaded photo when has-logo is set on the
       hero container; otherwise the image is hidden and the gradient
       venue name renders CENTERED inside the same-sized frame, so the
       purple name never duplicates when there IS a logo. 2026-07-25. */
    .logo-hero { text-align: center; padding: 20px 20px 16px; }
    .logo-slot {
      position: relative; width: 100%; max-width: 500px; height: 140px;
      margin: 0 auto 12px; background: var(--card, #111); border: 2px solid var(--border);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .profile-pic {
      max-width: 100%; max-height: 100%; object-fit: contain;
      display: none; /* revealed via .has-logo below */
    }
    .logo-slot-name {
      display: block; font-size: 2rem; font-weight: 700; margin: 0; padding: 0 16px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-align: center; line-height: 1.15; word-break: break-word;
    }
    .logo-hero.has-logo .profile-pic { display: block; }
    .logo-hero.has-logo .logo-slot-name { display: none; }
    .logo-hero:not(.has-logo) .logo-slot { border-color: rgba(255,255,255,0.06); background: rgba(255,255,255,0.02); }
    .venue-name {
      font-size: 1.75rem; font-weight: 700; margin: 0 0 4px;
      background: linear-gradient(135deg, var(--purple), var(--cyan));
      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .venue-address { font-size: 0.85rem; color: var(--text-gray); margin: 0; }

    /* TABS */
    /* 2026-08-11: sticky under the app-header. --app-header-height is
       defined in gigsfill-modern.css and adapts for mobile. z-index:90
       sits under the header (100). Opaque background so page content
       doesn't bleed through as it scrolls under the tab bar. */
    .profile-tabs {
      display: flex; gap: 0; border-bottom: 1px solid var(--border);
      margin-bottom: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch;
      /* Center tabs when they all fit; horizontal scroll otherwise. */
      justify-content: center;
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      z-index: 90;
      background: var(--bg);
      height: 50px;
      /* Align first tab under the logo — see gigsfill.css .tabs comment. */
      padding-left: calc((100vw - var(--container-max)) / 2 + 20px);
      padding-right: calc((100vw - var(--container-max)) / 2 + 20px);
      box-sizing: border-box;
      align-items: center;
    }
    /* Reserve space in flow for the fixed tab bar (main container has
       40px padding-top by default; add 50 for tabs + gap). */
    .profile-container:has(.profile-tabs) {
      padding-top: 66px !important;
    }
    .profile-tabs button {
      flex-shrink: 0; padding: 10px 16px; background: none; border: none;
      border-bottom: 2px solid transparent; color: var(--text-gray);
      font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
      white-space: nowrap;
    }
    .profile-tabs button:hover { color: var(--text); }
    .profile-tabs button.active { color: var(--cyan); border-bottom-color: var(--cyan); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Cards */
    .content-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: var(--card-padding); margin-bottom: var(--card-gap);
    }
    .content-card > h2 {
      font-size: var(--section-title-size); font-weight: 700; color: var(--cyan);
      text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 12px;
      padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    /* Venue Info */
    .venue-bio { margin-top: 14px; font-size: 0.875rem; line-height: 1.6; color: var(--text); white-space: pre-line; }
    .venue-bio:empty { display: none; }
    .details-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .perks-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .detail-item {
      background: rgba(255,255,255,0.015); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 6px; padding: 10px 12px;
    }
    .detail-item .label { font-size: 0.65rem; font-weight: 600; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
    .detail-item .value { font-size: 0.8rem; color: var(--text); font-weight: 500; }
    .detail-item .detail { font-size: 0.7rem; color: var(--text-gray); font-style: italic; margin-top: 4px; padding-left: 8px; border-left: 2px solid var(--border); }
    .detail-item.full-width { grid-column: span 2; }

    /* Calendar */
    .cal-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .cal-toolbar h3 { margin: 0; font-size: 1.3rem; color: var(--text); font-weight: 600; }
    .cal-toolbar button {
      background: transparent; border: 1px solid var(--border);
      color: var(--text); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all 0.2s;
    }
    .cal-toolbar button:hover { background: rgba(255,255,255,0.05); border-color: var(--cyan); color: var(--cyan); }
    .cal-header {
      display: grid; grid-template-columns: repeat(7, 1fr); text-align: center;
      color: var(--text-gray); font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
    .cal-day {
      background: rgba(8, 11, 22, 0.97); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; min-height: 130px; padding: 8px 4px;
      cursor: pointer; position: relative; transition: all 0.2s;
      display: flex; flex-direction: column;
      width: 100%; min-width: 0; box-sizing: border-box; overflow: hidden;
    }
    .cal-day:hover { background: rgba(18, 22, 38, 0.98); border-color: rgba(124, 107, 255, 0.45); }
    .cal-day.empty { background: rgba(14, 17, 28, 0.6); border-color: rgba(255,255,255,0.04); cursor: default; }
    /* Three-tier hierarchy matching every other calendar on the site.
       Spillover cells get a darker background + heavily muted numbers;
       current-month bumps brighter so it dominates. Month-boundary
       label ("Aug 1", "Jul 26" top-left) uses solid cyan bold. */
    .cal-day.other-month { background: rgba(0,0,0,0.22); }
    .cal-day.other-month:hover { background: rgba(0,0,0,0.08); }
    .cal-day.other-month .day-num { color: rgba(255,255,255,0.18); }
    .cal-day .day-num { position: absolute; top: 8px; right: 10px; font-size: 0.75rem; color: rgba(255,255,255,0.88); font-weight: 500; margin-bottom: 0; }
    .cal-day .day-num.month-boundary { font-weight: 700; letter-spacing: 0.01em; color: #06b6d4; }
    /* Uniform dimness — boundary matches plain spillover numbers. */
    .cal-day.other-month .day-num.month-boundary { color: rgba(255, 255, 255, 0.18); }
    .cal-day.today { border-color: var(--cyan); }
    .cal-day.past { opacity: 0.5; background: rgba(0,0,0,0.2); cursor: default; }
    .cal-day.past:hover { background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.08); }
    .cal-day.past .day-num { color: rgba(255,255,255,0.3); }
    /* Gig pills */
    .cal-gig {
      padding: 2px 8px; border-radius: 6px; margin-bottom: 4px;
      font-size: 0.65rem; font-weight: 600; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
      transition: all 0.2s; max-width: 100%;
    }
    .cal-gig:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .cal-gig.booked { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .cal-gig.open { background: linear-gradient(135deg, #10b981, #059669); color: #000 !important; }
    /* Scrollable gigs container */
    .cal-gigs-container {
      max-height: 100px; overflow-y: auto; overflow-x: hidden; margin-top: 26px; padding-right: 4px;
      scrollbar-width: thin; scrollbar-color: var(--accent-purple) rgba(0,0,0,0.2);
    }
    .cal-gigs-container::-webkit-scrollbar { width: 6px; }
    .cal-gigs-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
    .cal-gigs-container::-webkit-scrollbar-thumb { background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); border-radius: 3px; }
    .cal-gigs-container .cal-gig { margin-top: 0; }
    .cal-gigs-container .cal-gig:last-child { margin-bottom: 0; }

    /* Gig Detail Modal */
    .gig-modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; z-index: 10000;
    }
    .gig-modal-overlay.hidden { display: none; }
    .gig-modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 28px 32px; max-width: 480px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      max-height: 90vh; overflow-y: auto;
    }
    .gig-modal.day-modal {
      max-width: min(980px, 96vw);
      width: fit-content;
      min-width: min(900px, 96vw);
      padding: 24px;
    }
    .gig-modal.day-modal .gig-row {
      font-size: 0.7rem;
      font-weight: 700;
    }
    .gig-modal.day-modal h3 {
      margin: 0 0 18px; font-size: 1rem; font-weight: 700; color: var(--text);
      padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .gig-modal-row {
      display: flex; justify-content: space-between; padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .gig-modal-row:last-of-type { border-bottom: none; }
    .gig-modal-label { font-size: 0.75rem; color: var(--text-gray); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
    .gig-modal-value { font-size: 0.8rem; color: var(--text); font-weight: 500; text-align: right; }
    .gig-modal-close {
      margin-top: 18px; width: 100%; padding: 10px; background: rgba(255,255,255,0.06);
      border: 1px solid var(--border); border-radius: 6px; color: var(--text-gray);
      font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .gig-modal-close:hover { background: rgba(255,255,255,0.1); color: var(--text); }
    .gig-modal-value a { color: var(--cyan); text-decoration: none; }
    .gig-modal-value a:hover { text-decoration: underline; }
    .cal-legend {
      display: flex; gap: 16px; justify-content: center; margin-top: 10px; font-size: 0.7rem;
    }
    .cal-legend span { display: flex; align-items: center; gap: 5px; color: var(--text-gray); }
    .cal-legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .cal-legend-dot.open { background: #10b981; }
    .cal-legend-dot.booked { background: #ef4444; }

    /* Social Media — centered grid of branded tiles (mirror of artist-profile).
       See comments there for the full rationale; same component on both pages. */
    .social-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, 110px);
      justify-content: center;
      gap: 12px;
    }
    .social-link {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; padding: 18px 8px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text-gray); text-decoration: none;
      font-size: 0.75rem; font-weight: 600; transition: all 0.18s ease;
    }
    .social-link svg {
      width: 34px; height: 34px;
      color: var(--brand, var(--text-gray));
      transition: transform 0.18s ease;
    }
    .social-link:hover {
      background: rgba(255,255,255,0.06);
      border-color: var(--brand, var(--purple));
      color: var(--text);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
    .social-link:hover svg { transform: scale(1.1); }
    @media (max-width: 480px) {
      .social-links { grid-template-columns: repeat(auto-fit, 90px); gap: 10px; }
      .social-link { padding: 14px 6px; font-size: 0.7rem; }
      .social-link svg { width: 28px; height: 28px; }
    }

    /* Media */
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .media-card {
      background: rgba(255,255,255,0.02); border: 1px solid var(--border);
      border-radius: 8px; overflow: hidden; cursor: pointer; transition: all 0.2s;
    }
    .media-card:hover { border-color: var(--purple); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.25); }
    .media-card img { width: 100%; height: 80px; object-fit: cover; display: block; }
    .media-title-label {
      padding: 6px 8px; font-size: 0.65rem; color: var(--text-gray);
      text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: rgba(0,0,0,0.3);
    }
    /* Caption row beneath the title-label on video cards. Optional —
       JS only emits this element when the caption is non-empty. */
    .media-caption-label {
      padding: 4px 8px 8px;
      font-size: 0.7rem;
      color: var(--text);
      line-height: 1.35;
      background: rgba(0,0,0,0.3);
      text-align: center;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    /* Video + Picture grid: bigger cards (4 per row on desktop, wraps to 3/2/1
       as viewport narrows), centered when a row is partially full.
       Mirror of artist-profile.html rule. See comments there. */
    #videos.media-grid,
    #pictures.media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, 210px);
      justify-content: center;
      gap: 14px;
    }
    #videos .media-card img,
    #pictures .media-card img { height: 130px; }
    #videos .media-title-label,
    #pictures .media-title-label {
      font-size: 0.78rem; padding: 8px 10px 4px;
      white-space: normal; line-height: 1.3;
      color: var(--text); font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    #videos .media-caption-label,
    #pictures .media-caption-label {
      font-size: 0.72rem; padding: 0 10px 10px;
      /* 2026-07-26: center caption text under pictures/videos so it
         aligns with the centered title above. Previously left-aligned. */
      text-align: center;
      -webkit-line-clamp: 5;
      background: transparent;
      color: var(--text-gray);
    }
    @media (max-width: 480px) {
      #videos.media-grid,
      #pictures.media-grid {
        grid-template-columns: minmax(0, 360px);
      }
      #videos .media-card img,
      #pictures .media-card img { height: 180px; }
    }

    .empty-msg { color: var(--text-gray); font-size: 0.82rem; text-align: center; padding: 24px 0; }

    /* Media Modal */
    #mediaModal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 9999; cursor: pointer; }
    #mediaModal.hidden { display: none; }
    #mediaModalContent img, #mediaModalContent video { max-width: 90vw; max-height: 90vh; border-radius: 10px; }
    #mediaModalContent iframe { border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

    @media (max-width: 600px) {
      .logo-slot { height: 110px; }
      .logo-slot-name { font-size: 1.5rem; }
      .venue-name { font-size: 1.4rem; }
      .details-row, .perks-grid { grid-template-columns: 1fr; }
      .detail-item.full-width { grid-column: span 1; }
      .media-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
      .cal-gig { font-size: 0.55rem; }
      .cal-day { min-height: 90px; padding: 6px; }
      .cal-gigs-container { margin-top: 20px; max-height: 70px; }
      .gig-modal { padding: 20px 24px; }
      .profile-tabs button { padding: 8px 10px; font-size: 0.7rem; }
    }
  </style>
  <script src="/app/static/js/security.js?v=2"></script>
  <script src="/app/static/js/time-format.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="logo"><img src="/app/static/img/gigsfill-logo.png" alt="GigsFill" style="height:44px;width:auto;flex-shrink:0;"></div>
      <div class="header-actions"><a class="btn ghost" href="/app/index.html">Home</a></div>
    </div>
  </header>

  <main class="profile-container">
    <div class="logo-hero" id="logoHero">
      <div class="logo-slot">
        <img id="venueLogo" class="profile-pic" src="/app/static/img/profile-placeholder.svg" alt="Venue photo"
          onerror="this.onerror=null;this.src='/app/static/img/profile-placeholder.svg';">
        <h1 class="venue-name logo-slot-name" id="venueName">Venue</h1>
      </div>
      <div class="venue-address" id="venueAddress"></div>
      <div id="venueAboutHeader" style="font-size:0.88rem;color:var(--text-gray);margin:6px auto 0;max-width:560px;line-height:1.5;font-style:italic;"></div>
    </div>

    <div class="profile-tabs">
      <!-- 2026-07-26: Venue Info tab + panel removed. About text still
           renders in the hero via #venueAboutHeader; capacity / details /
           perks / PRO licensing were owner-side info that didn't need to
           be public. Calendar is the default tab. -->
      <button id="tabBtnCalendar" class="active" onclick="switchTab('calendar')">Calendar</button>
      <button id="tabBtnVideos" onclick="switchTab('videos')">Videos</button>
      <button id="tabBtnPictures" onclick="switchTab('pictures')">Pictures</button>
      <button id="tabBtnSocial" onclick="switchTab('social')">Social Media</button>
      <button id="tabBtnReviews" onclick="switchTab('reviews')">Reviews <span id="reviewsBadge" style="font-size:0.7rem;color:var(--text-muted);"></span></button>
      <!-- 2026-08-07: Gig Details tab — hidden by default, revealed only
           when the /public endpoint reports viewer_is_artist=true. Gives
           logged-in artist users a full view of the venue's rig / pay /
           tabs / load-in details (same info venues manage on venue-edit.html)
           so artists can decide whether to book. -->
      <button id="tabBtnGigdetails" onclick="switchTab('gigdetails')" style="display:none;">Gig Details</button>
    </div>

    <!-- CALENDAR TAB -->
    <div class="tab-panel active" id="tab-calendar">
      <div class="content-card">
        <div class="cal-toolbar">
          <button onclick="changeMonth(-1)">◀ Prev</button>
          <h3 id="calMonth"></h3>
          <button onclick="changeMonth(1)">Next ▶</button>
        </div>
        <!-- "Show All Gigs" — parity with the artist book-gigs page's
             list view. Public: no pay column, no cancel action. -->
        <div style="display:flex; justify-content:flex-end; margin-top:8px;">
          <button type="button" onclick="openVenuePublicGigsList()"
            style="font-size:0.75rem; color:var(--text-muted); background:transparent; padding:4px 10px; border:1px solid rgba(255,255,255,0.1); border-radius:6px; cursor:pointer;"
            onmouseover="this.style.borderColor='rgba(34,197,94,0.4)';this.style.color='#22c55e'"
            onmouseout="this.style.borderColor='rgba(255,255,255,0.1)';this.style.color='var(--text-muted)'">📋 Show All Gigs</button>
        </div>
        <div class="cal-header"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-legend">
          <span><span class="cal-legend-dot open"></span> Open</span>
          <span><span class="cal-legend-dot booked"></span> Booked</span>
        </div>
      </div>
    </div>

    <!-- VIDEOS TAB -->
    <div class="tab-panel" id="tab-videos">
      <div class="content-card"><div class="media-grid" id="videos"></div><div class="empty-msg" id="videosEmpty" style="display:none;">No videos uploaded yet.</div></div>
    </div>
    <!-- PICTURES TAB -->
    <div class="tab-panel" id="tab-pictures">
      <div class="content-card"><div class="media-grid" id="pictures"></div><div class="empty-msg" id="picturesEmpty" style="display:none;">No pictures uploaded yet.</div></div>
    </div>
    <!-- SOCIAL MEDIA TAB -->
    <div class="tab-panel" id="tab-social">
      <div class="content-card"><div class="social-links" id="socialMedia"></div><div class="empty-msg" id="socialEmpty" style="display:none;">No social media links added yet.</div></div>
    </div>
    <!-- REVIEWS TAB -->
    <div class="tab-panel" id="tab-reviews">
      <div class="content-card">
        <div id="venueRatingSummaryContainer" style="margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);"></div>
        <div id="venueReviewsListContainer"></div>
      </div>
    </div>
    <!-- GIG DETAILS TAB (artists only — populated by _renderGigDetailsTab) -->
    <div class="tab-panel" id="tab-gigdetails">
      <div class="content-card">
        <div id="gigDetailsContent"></div>
      </div>
    </div>
  </main>

  <!-- 2026-07-26: prev/next arrows + swipe/keyboard nav across pictures
       and inline-embeddable videos. Arrows are siblings of #mediaModalContent
       so they persist across content re-renders on navigation. -->
  <div class="hidden" id="mediaModal">
    <button onclick="closeMediaModal()" aria-label="Close" style="position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:1.8rem;cursor:pointer;line-height:1;z-index:2;">&times;</button>
    <button id="lbPrevBtn" onclick="_lbPrev()" aria-label="Previous" style="display:none;position:absolute;top:50%;left:12px;transform:translateY(-50%);background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.18);color:#fff;cursor:pointer;width:44px;height:44px;border-radius:50%;padding:0;z-index:2;align-items:center;justify-content:center;" onmouseover="this.style.background='rgba(0,0,0,0.75)';this.style.borderColor='rgba(255,255,255,0.35)';" onmouseout="this.style.background='rgba(0,0,0,0.55)';this.style.borderColor='rgba(255,255,255,0.18)';"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
    <button id="lbNextBtn" onclick="_lbNext()" aria-label="Next"     style="display:none;position:absolute;top:50%;right:12px;transform:translateY(-50%);background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.18);color:#fff;cursor:pointer;width:44px;height:44px;border-radius:50%;padding:0;z-index:2;align-items:center;justify-content:center;" onmouseover="this.style.background='rgba(0,0,0,0.75)';this.style.borderColor='rgba(255,255,255,0.35)';" onmouseout="this.style.background='rgba(0,0,0,0.55)';this.style.borderColor='rgba(255,255,255,0.18)';"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
    <div id="lbCounter" style="display:none;position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.65);font-size:0.75rem;letter-spacing:0.05em;z-index:2;"></div>
    <div id="mediaModalContent"></div>

  <div class="gig-modal-overlay hidden" id="gigModal">
    <div class="gig-modal">
      <h3>Gig Details</h3>

      <div class="modal-actions" style="margin-top:16px;display:flex;justify-content:flex-end;"><button class="btn ghost" onclick="closeGigModal()">Close</button></div>

  </div>

  <script>
    /* Brand icon helpers — inline SVGs (no external deps) + brand colors.
       Used by the Social Media tab. See artist-profile.html for the full
       comment block; this is the venue-side mirror. */
    const BRAND_COLORS = {
      spotify:    '#1DB954',
      instagram:  '#E1306C',
      facebook:   '#1877F2',
      youtube:    '#FF0000',
      twitter:    '#e5e7eb',
      tiktok:     '#69C9D0',
      website:    '#06b6d4',
      yelp:       '#D32323',
      google_maps:'#EA4335'
    };
    function brandIcon(name) {
      const ICONS = {
        spotify:   '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.52 17.34c-.24.36-.66.48-1.02.24-2.82-1.74-6.36-2.1-10.56-1.14-.42.12-.78-.18-.9-.54-.12-.42.18-.78.54-.9 4.56-1.02 8.52-.6 11.64 1.32.42.18.48.66.3 1.02zm1.44-3.3c-.3.42-.84.6-1.26.3-3.24-1.98-8.16-2.58-11.94-1.38-.48.12-1.02-.12-1.14-.6-.12-.48.12-1.02.6-1.14C9.6 9.9 15 10.56 18.72 12.84c.36.18.54.78.24 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.3c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.72 1.62.54.3.72 1.02.42 1.56-.3.42-1.02.6-1.56.3z"/></svg>',
        instagram: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85 0 3.21-.01 3.58-.07 4.85-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07-3.2 0-3.58-.01-4.85-.07-3.26-.15-4.77-1.7-4.92-4.92-.06-1.27-.07-1.64-.07-4.85 0-3.2.01-3.58.07-4.85.15-3.23 1.66-4.77 4.92-4.92 1.27-.06 1.65-.07 4.85-.07zM12 0C8.74 0 8.33.01 7.05.07 2.7.27.27 2.69.07 7.05.01 8.33 0 8.74 0 12c0 3.26.01 3.67.07 4.95.2 4.36 2.62 6.78 6.98 6.98C8.33 23.99 8.74 24 12 24c3.26 0 3.67-.01 4.95-.07 4.35-.2 6.78-2.62 6.98-6.98.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95C23.73 2.69 21.31.27 16.95.07 15.67.01 15.26 0 12 0zm0 5.84a6.16 6.16 0 1 0 0 12.32 6.16 6.16 0 0 0 0-12.32zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.41-11.85a1.44 1.44 0 1 0 0 2.88 1.44 1.44 0 0 0 0-2.88z"/></svg>',
        facebook:  '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M24 12.07C24 5.45 18.63.07 12 .07S0 5.45 0 12.07c0 5.99 4.39 10.96 10.13 11.86V15.5H7.08v-3.47h3.05V9.43c0-3.01 1.79-4.67 4.53-4.67 1.31 0 2.69.23 2.69.23v2.95H15.83c-1.49 0-1.96.93-1.96 1.88v2.25h3.33l-.53 3.47h-2.8v8.43C19.61 23.03 24 18.06 24 12.07z"/></svg>',
        youtube:   '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.55 12 3.55 12 3.55s-7.5 0-9.38.5A3.02 3.02 0 0 0 .5 6.2C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.87.5 9.38.5 9.38.5s7.5 0 9.38-.5a3.02 3.02 0 0 0 2.12-2.14C24 15.93 24 12 24 12s0-3.93-.5-5.81zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/></svg>',
        twitter:   '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.24 2.25h3.31l-7.23 8.26 8.5 11.24h-6.65l-5.21-6.82L4.99 21.75H1.68l7.73-8.83L1.25 2.25h6.83l4.71 6.23zM17.08 19.77h1.83L7.08 4.13H5.12L17.08 19.77z"/></svg>',
        tiktok:    '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.07 20.1a6.34 6.34 0 0 0 10.86-4.43V8.31a8.16 8.16 0 0 0 4.77 1.52V6.42a4.85 4.85 0 0 1-1.11.27z"/></svg>',
        website:   '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM11 19.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>',
        yelp:      '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.05 14.42l1.43 4.94c.1.38-.14.78-.5.83-1.66.21-3.24-.16-4.7-.96-.21-.11-.27-.39-.13-.59l3.27-4.45c.2-.28.55-.16.63.23zm-2.06-2.97L7.81 6.05c-.22-.27-.62-.14-.78.18A11.15 11.15 0 0 0 6.4 9.96c-.02.36.26.69.62.71l5.16-.04c.34-.01.5-.41.31-.69zm5.96-.34l-4.7 1.43c-.36.11-.36.62 0 .73l4.7 1.43c.4.13.78-.17.78-.59v-2.41c0-.42-.38-.72-.78-.59zm-3.59-1.6l3.27 4.45c.14.2.42.14.55-.06.84-1.36 1.32-2.86 1.42-4.45.03-.36-.24-.65-.6-.7l-4.31-.63c-.34-.05-.53.4-.33.66zm-3.06 4.71l-3.4-3.85c-.27-.31-.78-.16-.83.25C7 12.16 7 13.71 7.38 15.18c.08.34.46.46.73.23l3.39-3.85c.18-.2.18-.51 0-.71l-.2-.43z"/></svg>',
        google_maps:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>'
      };
      return ICONS[name] || ICONS.website;
    }

    // 'info' tab retired 2026-07-26 — the button + panel were removed,
    // bio/details/perks moved into the hero. Removing 'info' from
    // TAB_NAMES so shared links like #info fall through cleanly instead
    // of activating a nonexistent panel.
    const TAB_NAMES = ['calendar','videos','pictures','social','reviews','gigdetails'];
    function switchTab(name) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.profile-tabs button').forEach(b => b.classList.remove('active'));
      const panel = document.getElementById('tab-' + name);
      if (panel) panel.classList.add('active');
      const btn = document.getElementById('tabBtn' + name.charAt(0).toUpperCase() + name.slice(1));
      if (btn) btn.classList.add('active');
      if (name === 'reviews' && !window._venueReviewsLoaded) {
        window._venueReviewsLoaded = true;
        renderVenueRatingSummary('venueRatingSummaryContainer', venueId);
        renderVenueReviews('venueReviewsListContainer', venueId);
      }
    }

    let venueData = null, venueGigs = [], calYear, calMonth;
    // window._VANITY is injected by the slug resolver (gigsfill.com/14cannons)
    // and takes precedence over the legacy ?venue_id=N query param.
    let venueId = (window._VANITY && window._VANITY.type === 'venue' ? window._VANITY.id : null)
                || new URLSearchParams(window.location.search).get("venue_id");

    (async function loadVenue() {
      if (!venueId) { document.querySelector('.profile-container').innerHTML = '<p style="text-align:center;color:var(--text-gray);padding:40px;">Missing venue_id parameter.</p>'; return; }

      const res = await fetch(`/api/venues/${venueId}/public`, { credentials: "include" });
      if (!res.ok) { document.querySelector('.profile-container').innerHTML = '<p style="text-align:center;color:var(--text-gray);padding:40px;">Venue not found.</p>'; return; }
      venueData = await res.json();

      // Hero
      document.getElementById("venueName").textContent = venueData.venue_name || "";
      const addr = [venueData.address_line_1, venueData.address_line_2, venueData.city, venueData.state, venueData.postal_code].filter(Boolean);
      // Render the address as a clickable Google Maps link — opens a new tab.
      // Query string format ("place name + full address") gives the best chance
      // of resolving to a real Maps pin instead of a generic place search.
      const _addrText = addr.join(", ");
      const _mapsQuery = encodeURIComponent([venueData.venue_name, _addrText].filter(Boolean).join(" "));
      const _addrEl = document.getElementById("venueAddress");
      if (_addrText) {
        _addrEl.innerHTML =
          `<a href="https://www.google.com/maps/search/?api=1&query=${_mapsQuery}" `
          + `target="_blank" rel="noopener noreferrer" `
          + `title="Open in Google Maps" `
          + `style="color:inherit;text-decoration:none;border-bottom:1px dotted currentColor;">`
          + `${esc(_addrText)} <span aria-hidden="true" style="font-size:0.85em;opacity:0.7;">↗</span></a>`;
      } else {
        _addrEl.textContent = "";
      }
      document.title = (venueData.venue_name || "Venue") + " – GigsFill";
      // Dynamic SEO updates
      const seoDesc = `${venueData.venue_name || 'Venue'}${venueData.city ? ' in ' + venueData.city + ', ' + venueData.state : ''} – live music venue on GigsFill. View upcoming events, amenities, and booking info.`;
      document.querySelector('meta[name="description"]')?.setAttribute('content', seoDesc);
      document.querySelector('meta[property="og:title"]')?.setAttribute('content', document.title);
      document.querySelector('meta[property="og:description"]')?.setAttribute('content', seoDesc);
      document.querySelector('meta[name="twitter:title"]')?.setAttribute('content', document.title);
      document.querySelector('meta[name="twitter:description"]')?.setAttribute('content', seoDesc);

      // About text lives in the hero (below the venue name).
      // 2026-07-26: Venue Info tab removed — bio, details, perks, PRO
      // certification, and the /api/me artist-reveal are all gone. The
      // details/perks were owner-facing (capacity, default pay, arrival,
      // load-in, stage/sound/lighting/engineer, bar/food tabs) and never
      // belonged on the public profile.
      const _aboutEl = document.getElementById("venueAboutHeader");
      if (_aboutEl && venueData.description) _aboutEl.textContent = venueData.description.trim();

      // Social
      const ensureProto = u => { if (!u) return ''; const t = u.trim(); return (t.startsWith('http://') || t.startsWith('https://')) ? t : 'https://' + t; };
      let links = [
        { url: venueData.website_url,     label: "Website",     brand: "website" },
        { url: venueData.facebook_url,    label: "Facebook",    brand: "facebook" },
        { url: venueData.instagram_url,   label: "Instagram",   brand: "instagram" },
        { url: venueData.twitter_url,     label: "X",           brand: "twitter" },
        { url: venueData.yelp_url,        label: "Yelp",        brand: "yelp" },
        { url: venueData.google_maps_url, label: "Google Maps", brand: "google_maps" }
      ].filter(l => l.url && l.url.trim());
      // Apply user-chosen order; brands not listed keep natural position.
      if (venueData.social_order) {
        const desired = String(venueData.social_order).split(',').map(s => s.trim()).filter(Boolean);
        const byBrand = Object.fromEntries(links.map(l => [l.brand, l]));
        const ordered = [];
        desired.forEach(b => { if (byBrand[b]) { ordered.push(byBrand[b]); delete byBrand[b]; } });
        links.forEach(l => { if (byBrand[l.brand]) ordered.push(l); });
        links = ordered;
      }
      if (links.length > 0) {
        // Audit fix (May 2026 part 5): escape the URL with escAttr() before
        // interpolating into href, and strip dangerous schemes. Previously a
        // saved URL containing `" onmouseover="alert(1)` would break out of
        // the href attribute and execute JS on every visitor.
        const _isSafeHref = (u) => { try { const t = String(u||'').trim().toLowerCase(); return t.startsWith('http://') || t.startsWith('https://'); } catch(_) { return false; } };
        document.getElementById("socialMedia").innerHTML = links.map(l => {
          const safeUrl = ensureProto(l.url);
          if (!_isSafeHref(safeUrl)) return '';
          const color = BRAND_COLORS[l.brand] || '#9ca3af';
          return `<a href="${escAttr(safeUrl)}" target="_blank" rel="noopener noreferrer" class="social-link" style="--brand:${color}" title="${esc(l.label)}">${brandIcon(l.brand)}<span>${esc(l.label)}</span></a>`;
        }).join('');
      } else {
        document.getElementById("socialEmpty").style.display = "block";
        // Hide the Social Media tab when there are no links —
        // see _hideEmptyTab defined in loadMedia() below.
        if (typeof _hideEmptyTab === 'function') _hideEmptyTab('social', true);
      }

      document.getElementById("venueLogo").src = "/app/static/img/profile-placeholder.svg";
      loadMedia();
      loadGigs();

      // 2026-08-07: Gig Details tab — only artists see it. Backend
      // computes viewer_is_artist against the current session cookie
      // (any artist owned or granted via entity_users flips it true).
      if (venueData.viewer_is_artist) {
        const btn = document.getElementById("tabBtnGigdetails");
        if (btn) btn.style.display = "";
        _renderGigDetailsTab();
      }

      // Analytics — one page_view per venue profile load, so the
      // venue's Analytics tab reflects direct-URL traffic even before
      // any gig click.
      if (typeof window.gfTrackPageView === 'function') {
        window.gfTrackPageView('venue_profile', {
          venue_id: parseInt(venueId, 10) || null,
          city:  (venueData && venueData.city)  || null,
          state: (venueData && venueData.state) || null,
        });
      }

      // Populate the Reviews tab badge ("Reviews (N)") on first load —
      // without this, the badge stays blank until the user actually clicks
      // the Reviews tab. Cheap one-shot fetch; failure is silent.
      try {
        const _rsRes = await fetch(`/api/venues/${venueId}/reviews/summary`, { credentials: "include" });
        if (_rsRes.ok) {
          const _rs = await _rsRes.json();
          const _b = document.getElementById("reviewsBadge");
          if (_b && _rs.review_count > 0) _b.textContent = `(${_rs.review_count})`;
        }
      } catch (_) { /* non-fatal */ }
    })();

    // ========== CALENDAR ==========
    async function loadGigs() {
      // Public profile may be viewed by anyone (no auth). The
      // /venues/{id}/gigs endpoint requires venue access — for non-
      // owners it 401s and the calendar appears empty. Use the
      // public-gigs endpoint and filter to this venue. Public endpoint
      // returns ~90 days of gigs (per audit fix) and already excludes
      // held gigs from being visible (per hold-feature filter).
      try {
        const r = await fetch(`/api/gigs/public`);
        if (r.ok) {
          const all = await r.json();
          const vid = parseInt(venueId, 10);
          venueGigs = (all || []).filter(g => parseInt(g.venue_id, 10) === vid);
        }
      } catch(e) {}
      const now = new Date(); calYear = now.getFullYear(); calMonth = now.getMonth();
      renderCalendar();
    }
    function changeMonth(d) { calMonth += d; if (calMonth > 11) { calMonth = 0; calYear++; } if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
    function renderCalendar() {
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      document.getElementById('calMonth').textContent = `${months[calMonth]} ${calYear}`;
      const firstDay = new Date(calYear, calMonth, 1).getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const _now = new Date();
      const todayStr = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,'0')}-${String(_now.getDate()).padStart(2,'0')}`;
      const icons = { 'Live Band': '🎸', 'DJ': '🎧', 'Comedian': '🎤', 'Trivia Host': '🧠', 'Open Mic MC':'🎙️', 'Karaoke MC':'🎶' };

      // Outlook-style month boundary label — same as every other
      // calendar on the site. Prefixes month abbreviation on:
      //   • day 1 of every visible month (target + spillover), AND
      //   • the very first grid cell so top-left spillover shows
      //     its month (e.g. "Jul 26" when viewing August).
      let _firstCellRendered = false;
      function _renderDayNum(d, monthIndex) {
        const isFirst = !_firstCellRendered;
        _firstCellRendered = true;
        if (d === 1 || isFirst) {
          const monAbbr = new Date(2000, monthIndex).toLocaleString("default", { month: "short" });
          return `<div class="day-num month-boundary">${monAbbr} ${d}</div>`;
        }
        return `<div class="day-num">${d}</div>`;
      }

      let html = '';
      // Leading days from previous month — real day numbers (Jul 2026).
      const prevMonthLast = new Date(calYear, calMonth, 0).getDate();
      const _prevM = calMonth === 0 ? 11 : calMonth - 1;
      for (let i = firstDay - 1; i >= 0; i--) {
        const d = prevMonthLast - i;
        const prevY = calMonth === 0 ? calYear - 1 : calYear;
        const ds = `${prevY}-${String(_prevM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isPast = ds < todayStr;
        html += `<div class="cal-day other-month${isPast ? ' past' : ''}">${_renderDayNum(d, _prevM)}</div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const isToday = ds === todayStr;
        const isPast = ds < todayStr;
        const dayGigs = venueGigs.filter(g => g.date === ds);
        const dayClickAttr = (!isPast && dayGigs.length > 0) ? ` onclick="openDayGigsModal(event,'${ds}')"` : '';
        html += `<div class="cal-day${isToday ? ' today' : ''}${isPast ? ' past' : ''}"${dayClickAttr}>${_renderDayNum(d, calMonth)}`;
        if (dayGigs.length > 0) {
          html += '<div class="cal-gigs-container">';
          let gigIdx = 0;
          dayGigs.forEach((g) => {
            if (g.is_multi_slot && g.slots && g.slots.length > 0) {
              // Expand multi-slot gigs into individual slot bubbles
              g.slots.slice().sort((a,b) => (a.start_time||'').localeCompare(b.start_time||'')).forEach((slot, slotIdx) => {
                const isBooked = slot.status === 'booked';
                const cls = isBooked ? 'booked' : 'open';
                const t = fmtTime(slot.start_time);
                const icon = (icons[g.artist_type] || '🎵') + ' ';
                const label = isBooked ? `${icon}${t} · ${slot.artist_name || 'Booked'}` : `${icon}${t} · Open`;
                const street = [venueData.address_line_1, venueData.address_line_2].filter(Boolean).join(' ');
                const cityState = [venueData.city, venueData.state].filter(Boolean).join(', ');
                const mapsQ = [venueData.venue_name, street, venueData.city, venueData.state].filter(Boolean).join(', ');
                const _ds = ds;
                const _dateLabel = (function(){
                  const [y,mo,dy] = _ds.split('-').map(Number);
                  const dt = new Date(y, mo-1, dy);
                  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
                  const mos=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function fmtTime(t) { if (!t) return ''; const [h,m] = t.split(':').map(Number); return ((h%12)||12)+':'+String(m).padStart(2,'0')+(h>=12?'PM':'AM'); }
    function fmtDate(d) { if (!d) return ''; const [y,mo,dy] = d.split('-'); const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return `${months[parseInt(mo)-1]} ${parseInt(dy)}, ${y}`; }

    async function showGigDetail(date, idx) {

      // fills it with the click affordance for artist viewers.
      const _vgdVid = parseInt(venueId, 10) || parseInt(g.venue_id, 10) || 0;

      rows += modalRowRaw('Venue', `${esc(_vgdName)}<span class="vgd-link-slot" data-vgd-vid="${_vgdVid}" data-vgd-name="${escAttr(_vgdName)}"></span>`);

            const slots = await slotsRes.json();
            slots.forEach(s => {

              const slotLabel = isBooked 
                ? `<a href="/app/artist-profile.html?artist_id=${s.artist_id}" target="_blank" style="color:${color}; text-decoration:none; font-weight:600;">${esc(s.artist_name || 'Booked')}</a>`

        fetch(`/api/gigs/${g.id}/flyer/public`).then(r=>r.json()).then(data=>{

        var dateStr = gi.date ? new Date(gi.date+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '';
        var timeStr = gi.start_time ? ft(gi.start_time)+(gi.end_time?' - '+ft(gi.end_time):'') : '';
        var loc = [gi.address_line_1, gi.city&&gi.state?gi.city+', '+gi.state:(gi.city||gi.state)].filter(Boolean).join('\n');

    // Extended 2026-07-25 to cover Instagram / TikTok / Vimeo / Facebook
    // so social video links actually PLAY in the lightbox instead of
    // silently 404ing with `<video src={html-page}>`.
    function _buildVenueVideoEmbed(src) {
      const s = String(src || '').trim();
      let m = s.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]+)/);
      if (m) return { type: 'iframe', url: `https://www.youtube.com/embed/${m[1]}` };
      m = s.match(/vimeo\.com\/(?:video\/)?(\d+)/);
      if (m) return { type: 'iframe', url: `https://player.vimeo.com/video/${m[1]}` };
      // Accept optional /{username}/ before /(p|reel|tv)/{shortcode}/ —
      // Instagram share links from a profile include a username segment
      // that we'd otherwise miss, falling through to <video>. 2026-07-25.
      // Preserve /p/, /reel/, or /tv/ path — the earlier /p/ rewrite
      // returned a "post not available" placeholder for reels since the
      // shortcode namespaces are distinct in Instagram's oEmbed resolver.
      m = s.match(/instagram\.com\/(?:[\w.-]+\/)?(p|reel|tv)\/([\w-]+)/);
      if (m) return { type: 'iframe', url: `https://www.instagram.com/${m[1]}/${m[2]}/embed/captioned/` };
      m = s.match(/tiktok\.com\/(?:@[^/]+\/video\/|v\/)(\d+)/);
      if (m) return { type: 'iframe', url: `https://www.tiktok.com/embed/v2/${m[1]}` };
      if (/facebook\.com\/.+\/(videos|watch)/.test(s) || /fb\.watch/.test(s)) {
        return { type: 'iframe', url: `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(s)}&show_text=0` };

      if (!el) return;
      let sx = 0, sy = 0, active = false;
      el.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) { active = false; return; }
        sx = e.touches[0].screenX; sy = e.touches[0].screenY; active = true;
      }, { passive: true });
      el.addEventListener('touchend', function (e) {
        if (!active) return;
        active = false;
        if (e.changedTouches.length !== 1) return;
        const dx = e.changedTouches[0].screenX - sx;
        const dy = e.changedTouches[0].screenY - sy;
        if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
        if (dx > 0) _lbPrev(); else _lbNext();
      }, { passive: true });
    })();
    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function escAttr(s) { return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

    // 2026-08-07: Gig Details tab — flat single-line-per-field layout.
    // Row-building lives in venue-gig-details-modal.js buildRowsHTML()
    // so this tab and the shared (Venue Gig Details) modal can't drift
    // apart. Only invoked when venueData.viewer_is_artist is true (see
    // the reveal check in loadVenue).
    function _renderGigDetailsTab() {
      const el = document.getElementById("gigDetailsContent");
      if (!el) return;
      if (window.venueGigDetails && window.venueGigDetails.buildRowsHTML) {
        el.innerHTML = window.venueGigDetails.buildRowsHTML(venueData || {});
      } else {
        el.innerHTML = `<div style="color:var(--text-muted);font-style:italic;padding:12px 0;">Venue details module not loaded.</div>`;
      }
    }

    async function loadVenueReviews(page) {
  if (!venueId) return;
  const list = document.getElementById('venueReviewsList');
  const pagination = document.getElementById('venueReviewsPagination');
  if (!list) return;

  try {
    // Load summary + paginated reviews in parallel
    const [summaryRes, reviewsRes] = await Promise.all([
      fetch(`/api/venues/${venueId}/reviews/summary`, { credentials: 'include' }),
      fetch(`/api/venues/${venueId}/reviews?page=${page}&limit=5`, { credentials: 'include' })
    ]);

    if (summaryRes.ok) {
      const s = await summaryRes.json();
      const badge = document.getElementById('reviewsBadge');
      const summary = document.getElementById('venueRatingSummary');
      if (s.review_count > 0) {
        if (badge) badge.textContent = `(${s.review_count})`;
        if (summary) {
          summary.style.display = 'flex';
          const stars = '★'.repeat(Math.round(s.avg_rating)) + '☆'.repeat(5 - Math.round(s.avg_rating));
          document.getElementById('venueAvgStars').textContent = stars;
          document.getElementById('venueAvgNum').textContent = parseFloat(s.avg_rating).toFixed(1);
          document.getElementById('venueReviewCount').textContent = `(${s.review_count} review${s.review_count !== 1 ? 's' : ''})`;
        }
      } else {
        if (badge) badge.textContent = '';
      }
    }

    if (!reviewsRes.ok) throw new Error('Failed to load reviews');
    const data = await reviewsRes.json();

    if (!data.reviews || data.reviews.length === 0) {
      list.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem; text-align:center; padding:20px 0;">No reviews yet. Artists who have performed here can leave a review.</p>';
      if (pagination) pagination.innerHTML = '';
      return;
    }

    list.innerHTML = data.reviews.map(r => {
      const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
      const date = new Date(r.created_at).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      return `
        <div style="padding:16px 0; border-bottom:1px solid rgba(255,255,255,0.06);">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
            <div style="display:flex; align-items:center; gap:10px;">
              <a href="/app/artist-profile.html?artist_id=${r.artist_id}" target="_blank"
                 style="font-weight:600; font-size:0.9rem; color:var(--cyan); text-decoration:none;">${esc(r.artist_name || 'Artist')}</a>
              <span style="color:#f59e0b; font-size:1rem; letter-spacing:1px;">${stars}</span>
              <span style="font-size:0.78rem; font-weight:600; color:#f59e0b;">${r.rating}/5</span>
            </div>
            <span style="font-size:0.75rem; color:var(--text-muted);">${date}</span>
          </div>
          ${r.review_text ? `<p style="margin:0; font-size:0.85rem; color:var(--text-gray); line-height:1.6;">${esc(r.review_text)}</p>` : ''}
        </div>`;
    }).join('');

    // Pagination
    if (pagination) {
      if (data.pages <= 1) {
        pagination.innerHTML = '';
      } else {
        const btns = [];
        for (let p = 1; p <= data.pages; p++) {
          const active = p === data.page;
          btns.push(`<button onclick="loadVenueReviews(${p})" style="padding:4px 12px; border-radius:6px; font-size:0.8rem; cursor:pointer; background:${active ? 'rgba(6,182,212,0.2)' : 'transparent'}; border:1px solid ${active ? 'rgba(6,182,212,0.5)' : 'rgba(255,255,255,0.15)'}; color:${active ? '#06b6d4' : 'var(--text-muted)'};">${p}</button>`);
        }
        pagination.innerHTML = btns.join('');
      }
    }
  } catch (e) {
    if (list) list.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">Could not load reviews.</p>';
    console.error('loadVenueReviews:', e);
  }
}

// Make pagination buttons work globally
window.loadVenueReviews = loadVenueReviews;
  </script>
